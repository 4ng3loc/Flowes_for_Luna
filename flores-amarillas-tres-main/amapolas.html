<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animación de Amapolas con Viento</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(to top, #1a2a6c, #b21f1f, #fdbb2d); /* Cielo al atardecer */
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
<iframe src="https://youtube.com" 
        width="0" height="0" frameborder="0" allow="autoplay">
</iframe>
    <canvas id="canvasAmapolas"></canvas>

    <script>
        const canvas = document.getElementById('canvasAmapolas');
        const ctx = canvas.getContext('2d');

        // Ajustar el canvas al tamaño de la pantalla
        function ajustarPantalla() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        ajustarPantalla();
        window.addEventListener('resize', ajustarPantalla);

        // Clase para crear cada amapola
        class Amapola {
            constructor() {
                this.x = Math.random() * canvas.width; // Posición X horizontal
                this.y = canvas.height; // Nacen desde el suelo
                this.altura = 150 + Math.random() * 150; // Altura del tallo
                this.radioFlor = 12 + Math.random() * 8; // Tamaño de la flor
                this.anguloOriginal = Math.random() * 100; // Desfase para que no se muevan idénticas
                this.velocidadViento = 0.02 + Math.random() * 0.02; // Qué tan rápido se balancea
            }

            dibujar(tiempo) {
                // Calcular el balanceo con el seno del tiempo
                let balanceo = Math.sin(tiempo * this.velocidadViento + this.anguloOriginal) * 25;
                let finalX = this.x + balanceo;
                let finalY = canvas.height - this.altura;

                // 1. Dibujar el tallo (curva suave de Bezier)
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.quadraticCurveTo(this.x, this.y - this.altura / 2, finalX, finalY);
                ctx.strokeStyle = '#2d5a27'; // Verde oscuro
                ctx.lineWidth = 3;
                ctx.stroke();

                // 2. Dibujar los pétalos de la Amapola (4 pétalos superpuestos)
                ctx.fillStyle = '#e60000'; // Rojo amapola clásico
                
                // Pétalo izquierdo
                ctx.beginPath();
                ctx.arc(finalX - this.radioFlor/2, finalY, this.radioFlor, 0, Math.PI * 2);
                ctx.fill();

                // Pétalo derecho
                ctx.beginPath();
                ctx.arc(finalX + this.radioFlor/2, finalY, this.radioFlor, 0, Math.PI * 2);
                ctx.fill();

                // Pétalo arriba
                ctx.beginPath();
                ctx.arc(finalX, finalY - this.radioFlor/2, this.radioFlor, 0, Math.PI * 2);
                ctx.fill();

                // Pétalo abajo
                ctx.beginPath();
                ctx.arc(finalX, finalY + this.radioFlor/2, this.radioFlor, 0, Math.PI * 2);
                ctx.fill();

                // 3. Centro de la flor (botón oscuro)
                ctx.beginPath();
                ctx.arc(finalX, finalY, this.radioFlor * 0.3, 0, Math.PI * 2);
                ctx.fillStyle = '#1a1a1a'; // Casi negro
                ctx.fill();
                
                // Detalles de polen (centro amarillo/púrpura)
                ctx.beginPath();
                ctx.arc(finalX, finalY, this.radioFlor * 0.1, 0, Math.PI * 2);
                ctx.fillStyle = '#8a00c2'; 
                ctx.fill();
            }
        }

        // Crear un arreglo con muchas amapolas
        const campoAmapolas = [];
        const cantidadFlores = 80;

        for (let i = 0; i < cantidadFlores; i++) {
            campoAmapolas.push(new Amapola());
        }

        // Ordenar las amapolas por altura para que las más cortas queden al frente (efecto 3D/profundidad)
        campoAmapolas.sort((a, b) => b.altura - a.altura);

        // Bucle de animación
        let tiempo = 0;
        function animar() {
            // Limpiar el canvas en cada fotograma conservando el fondo CSS
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Dibujar cada amapola del campo
            campoAmapolas.forEach(amapola => amapola.dibujar(tiempo));

            tiempo += 1;
            requestAnimationFrame(animar);
        }

        // Iniciar animación
        animar();
    </script>
</body>
</html>
